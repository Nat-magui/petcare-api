name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, build and unit tests
    runs-on: ubuntu-latest
    env:
      # Prisma reads DATABASE_URL during postinstall, even without a database.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/petcare_ci?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
