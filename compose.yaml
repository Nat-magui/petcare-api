services:
  postgres:
    image: postgres:17
    container_name: petcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare_password
      POSTGRES_DB: petcare
    ports:
      - "5432:5432"
    volumes:
      - petcare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petcare_postgres_data: